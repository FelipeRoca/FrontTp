
<body style="background-color: #f1f1f1; display: block; height: 120vh;">
    <div class="card" style="border: solid 2px;">
      <p-menubar [model]="items">
        <ng-template pTemplate="start">
          <span style="text-align: center; color: black;"> RESEÑAS TURISTICAS </span>
        </ng-template>
      </p-menubar>
    </div>
  
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h1 class="text-center mb-4" style="color: #135B9E">Modifique su reseña!</h1>
          <form [formGroup]="myForm" (ngSubmit)="onFormSubmit()">
            <div class="form-group">
              <label for="exampleFormControlTextarea1">Modifique la reseña, cuéntenos qué tal anduvo esa estancia!</label>
              <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" formControlName="description"></textarea>
            </div>
  
            <div class="form-group">
              <label for="floatingSelect">Cambie las estrellas de puntuación para este sitio</label>
              <select class="form-control" id="floatingSelect" formControlName="stars">
                <option selected>Estrellas</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </div>
  
            <div class="text-center">
              <button type="submit" class="btn btn-outline-primary">Guardar reseña</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
