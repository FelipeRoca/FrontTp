

<body>
  <div class="card">
    <app-menubar></app-menubar>
  </div>

  <h1 class="display-1">Iniciar Sesion</h1>

  <div class="form-div">
    <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
      <div class="form-div2">
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Correo electronico</label>
          <input
            type="text"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
            placeholder="ejemplo@hotmail.com"
            formControlName="email"
          />
          <div id="emailHelp" class="form-text">
            Nunca compartiremos su correo electronico
          </div>
        </div>
      </div>

      <div class="password-div">
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Contraseña</label>
          <div class="password-div2">
            <input
              [type]="getPasswordType()"
              class="form-control col"
              id="exampleInputPassword1"
              formControlName="password"
            />
            <button (click)="onShow()" type="button" class="btn btn-outline-secondary" class="password-button">
              <span class="fa" [ngClass]="passwordVisible ? 'fa fa-eye-slash' : 'fa fa-eye'"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="buttons">
        <button type="submit" class="btn btn-primary submit">Iniciar Sesion</button>
        <button type="button" class="btn btn-light button" routerLink="/registrarse">Registrarse</button>
      </div>
    </form>
  </div>
</body>
