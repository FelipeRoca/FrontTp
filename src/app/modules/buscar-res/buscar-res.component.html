

  <script src="https://unpkg.com/leaflet@1.0.2/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.2/dist/leaflet.css" />
  
  <body class="body">
  
    <div class="card">
      <p-menubar [model]="items">
        <ng-template pTemplate="start">
          <span class="title-body"> RESEÑAS TURISTICAS </span>
        </ng-template>
      </p-menubar>
    </div>
  
    <div class="main-div">
      <h1 class="title">Buscar una reseña</h1>
  
      <div class="flex-d">
        <div class="input-group">
          <input #inputValue class="form-control" type="text" placeholder="Ingrese una ciudad" aria-label="Search" style="width: 600px;">
          <button class="btn btn-outline-success" type="submit" (click)="mostrarInput(inputValue)">Buscar</button>
        </div>
      </div>
  
      <div class="table">
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">Pais</th>
              <th scope="col">Ciudad</th>
              <th scope="col">Estrellas</th>
              <th scope="col">Aclaracion</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let review of reviews">
              <td>{{review?.City?.Country?.name}}</td>
              <td>{{review?.City?.name}}</td>
              <td>{{review.stars}}</td>
              <td>{{review.description}}</td>
            </tr>
          </tbody>
        </table>
  
        <div class="restart">
          <button type="button" class="btn btn-primary btn-lg" (click)="restablecerCiudades()">Restablecer</button>
        </div>
      </div>
  
      <div class="d-flex justify-content-center">
        <div class="map-div">
          <div id="map"></div>
        </div>
      </div>
  
      <div class="tripadvisor-section" *ngIf="showTripAdvisor">
        <h2 class="titleTripAD">Alojamientos en {{ selectedCity }}</h2>
        <div class="div-tripAd">
        <a class="linkTripAd" [href]="tripAdvisorSearchUrl" target="_blank">Ver alojamientos en {{ selectedCity }} en TripAdvisor</a>
      </div>
      </div>
      
    </div>
  </body>
